name: TeamProof CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build packages and applications
        run: npm run build

      - name: Run Backend Integration Tests
        env:
          NODE_ENV: test
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/teamproof_test
          CLIENT_URL: http://localhost:5173
          SESSION_SECRET: test-session-secret-key-12345
        run: npm run test
